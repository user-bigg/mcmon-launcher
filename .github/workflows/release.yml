name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Forks build the same code; only the official repository may publish releases under our name.
    if: github.repository == 'user-bigg/mcmon-launcher'
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Tag matches package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: bash scripts/check
      - run: npm run build
        env:
          MCMONITOR_TELEMETRY_BEHAVIOR: 'on'
          MCMONITOR_MS_CLIENT_ID: ${{ secrets.MCMONITOR_MS_CLIENT_ID }}
      - name: 32-bit MinGW for the installer plugin
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW32
          install: mingw-w64-i686-gcc
      - run: node scripts/nsis-plugin.ts
        env:
          NSIS_PLUGIN_MINGW_BIN: ${{ steps.msys2.outputs.msys2-location }}\mingw32\bin
      - run: npx electron-builder --win --x64 --publish never
      - run: bash scripts/verify-fuses release/win-unpacked/MCMonitorLauncher.exe
      - run: bash scripts/report-size release
      - run: bash scripts/smoke-run release/win-unpacked/MCMonitorLauncher.exe
      - run: bash scripts/verify-asar-integrity release/win-unpacked MCMonitorLauncher.exe
      - name: Update files match the installer
        run: bash scripts/update-yml-check release "$VERSION"
      - name: Collect unsigned update files
        run: |
          installer="mcmonitor-launcher-$VERSION-win-x64.exe"
          mkdir unsigned
          cp "release/$installer" "release/$installer.blockmap" unsigned/
          for channel in latest beta; do
            if [[ -f "release/$channel.yml" ]]; then
              cp "release/$channel.yml" unsigned/
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-win-${{ env.VERSION }}
          path: unsigned/*
          if-no-files-found: error
          retention-days: 3

  build-mac:
    if: github.repository == 'user-bigg/mcmon-launcher'
    runs-on: macos-15
    timeout-minutes: 40
    env:
      APP: release/mac-arm64/MC Monitor Launcher.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm ci
      - run: bash scripts/check
      - run: npm run build
        env:
          MCMONITOR_TELEMETRY_BEHAVIOR: 'on'
          MCMONITOR_MS_CLIENT_ID: ${{ secrets.MCMONITOR_MS_CLIENT_ID }}
      - run: npx electron-builder --mac --arm64 --publish never
      - run: bash scripts/verify-fuses "$APP"
      - name: Ad hoc signature verifies
        run: codesign --verify --deep --strict --verbose=2 "$APP"
      - name: The update zip unpacks into our signed application
        run: bash scripts/verify-mac-update "release/mcmonitor-launcher-$VERSION-mac-arm64.zip"
      - run: bash scripts/report-size release
      - run: bash scripts/smoke-run "$APP/Contents/MacOS/MC Monitor Launcher"
      - run: bash scripts/verify-asar-integrity "$APP" "Contents/MacOS/MC Monitor Launcher"
      - name: Update files match the archive
        run: bash scripts/update-yml-check release "$VERSION" mac
      - name: Collect unsigned update files
        run: |
          base="mcmonitor-launcher-$VERSION-mac-arm64"
          mkdir unsigned
          cp "release/$base.zip" "release/$base.zip.blockmap" "release/$base.dmg" unsigned/
          for channel in latest beta; do
            if [[ -f "release/$channel-mac.yml" ]]; then
              cp "release/$channel-mac.yml" unsigned/
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-mac-${{ env.VERSION }}
          path: unsigned/*
          if-no-files-found: error
          retention-days: 3

  # The ed25519 key never meets code installed by npm: this job only checks out the repository,
  # takes the built files from the artifact and runs scripts that import node:* modules only.
  sign:
    needs: [build, build-mac]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unsigned-*-${{ env.VERSION }}
          merge-multiple: true
          path: dist
      - name: Update files match the installers
        run: |
          bash scripts/update-yml-check dist "$VERSION" win
          bash scripts/update-yml-check dist "$VERSION" mac
      - name: Sign the updates (ed25519)
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          for installer in "dist/mcmonitor-launcher-$VERSION-win-x64.exe" "dist/mcmonitor-launcher-$VERSION-mac-arm64.zip"; do
            bash scripts/update-sign "$installer"
            bash scripts/update-verify "$installer"
          done
      - name: Checksums
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error
      - name: Draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft "${prerelease[@]}" \
            --title "MC Monitor Launcher $VERSION" \
            --notes "SHA-256: see SHA256SUMS.txt"
